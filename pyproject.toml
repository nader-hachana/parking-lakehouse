[project]
name = "parking-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# Provided by Databricks in notebooks and pipelines.
builtins = ["spark", "dbutils", "display"]
