name: deploy

# After a merge to main: run the checks again, then deploy the bundle to Databricks.
# The deploy only updates the job and the pipeline. It does not run the job, and the
# schedule stays paused unless the bundle says otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy that is halfway through. A newer one waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate the bundle
        run: databricks bundle validate

      # A fresh runner has no local state. If the plan wants to create anything, the job and
      # the pipeline that already exist are not recognised, and a deploy would duplicate them
      # (Free Edition allows one active pipeline). Stop instead of deploying.
      - name: Plan, and refuse to create new resources
        run: |
          databricks bundle plan | tee plan.txt
          if grep -Eq '^create ' plan.txt; then
            echo "::error::The plan would create new resources instead of updating the existing ones."
            exit 1
          fi

      - name: Deploy the bundle
        run: databricks bundle deploy
