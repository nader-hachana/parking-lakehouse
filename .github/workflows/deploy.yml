name: deploy

# After a merge to main: run the checks again, then deploy the bundle to Databricks.
# The deploy updates the job, the pipeline and the dashboard. It does not run the job, and the
# schedule stays paused unless the bundle says otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy that is halfway through. A newer one waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1.21.0
        with:
          version: 1.21.0

      - name: Validate the bundle
        run: databricks bundle validate

      # A fresh runner has no local state. If the plan wants to create something, a resource that
      # already exists is not recognised, and a deploy would duplicate it (Free Edition allows one
      # active pipeline). A recreate or a delete would remove a resource that holds data (a pipeline
      # takes its tables with it). Stop instead of deploying.
      - name: Plan, and refuse to create, recreate or delete resources
        run: |
          databricks bundle plan | tee "$RUNNER_TEMP/plan.txt"
          if grep -Eq '^(create|recreate|delete) ' "$RUNNER_TEMP/plan.txt"; then
            echo "::error::The plan would create, recreate or delete resources instead of updating the existing ones."
            exit 1
          fi

      - name: Deploy the bundle
        run: databricks bundle deploy
