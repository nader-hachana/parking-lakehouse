name: ci

# Lint and unit tests. No Databricks credentials are needed: the tests are plain Python.
# They run on every pull request, and the deploy workflow calls this workflow
# (workflow_call) before it deploys anything from main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The tests start a small local Spark session to evaluate the SQL quality rules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails when uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
